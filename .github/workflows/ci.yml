name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  jvm:
    name: JVM modules (core, engine-api, eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Without an Android SDK only the JVM modules are configured (see settings.gradle.kts).
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: |
            mrz-core/build/reports/tests
            mrz-engine-api/build/reports/tests
            tools/eval/build/reports/tests

  android:
    name: Android modules
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :mrz-sdk:check :mrz-ui:assembleDebug :sample-app:assembleDebug --no-daemon
